[project]
name = "task-parser"
version = "0.1.0"
description = ""
authors = [
    {name = "olasp",email = "olaspain@BK.RU"}
]
requires-python = ">=3.13,<3.15"
dependencies = [
    "aiogram (>=3.31.0,<4.0.0)",
    "sqlalchemy[asyncio] (>=2.1.8,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "apscheduler (>=3.10,<4.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "pydantic (>=2.13,<2.14)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.4.1.post1,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "respx (>=0.23.1,<0.24.0)",
    "black (>=26.10.1,<27.0.0)",
    "isort (>=9.0.2,<10.0.0)",
    "flake8 (>=7.5.0,<8.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "mypy (>=2.4.1,<3.0.0)"
]


[tool.black]
line-length = 119
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 119

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["\\.venv", "migrations"]
mypy_path = "src"


plugins = ["pydantic.mypy"]


[tool.poetry]
package-mode = false


[tool.pytest.ini_options]
pythonpath = ["src"]